name: Add Anki import diagnostics

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/add-import-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add stage context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/anki/anki-package.ts')
          s=p.read_text()
          old="const media=latest?decodeLatestMedia(zip):decodeLegacyMedia(zip),SQL=await sqlRuntime(),db=new SQL.Database(collectionBytes);"
          new="let media:Map<string,PackageMedia>;try{media=latest?decodeLatestMedia(zip):decodeLegacyMedia(zip)}catch(error){throw new Error('Anki media metadata: '+(error instanceof Error?error.message:String(error)))}const SQL=await sqlRuntime(),db=new SQL.Database(collectionBytes);"
          if old not in s: raise SystemExit('media target missing')
          s=s.replace(old,new,1)
          old2="const noteTypes=modern?decodeModernNotetypes(db):decodeLegacyNotetypes(db),decks=modern&&tableExists(db,'decks')?decodeModernDecks(db,profileId):decodeLegacyDecks(db,profileId),noteTypeMap=new Map(noteTypes.map((item)=>[item.sourceId,item])),deckMap=new Map(decks.map((item)=>[item.sourceId,item.local.id]));"
          new2="let noteTypes:SourceNoteType[],decks:SourceDeck[];try{noteTypes=modern?decodeModernNotetypes(db):decodeLegacyNotetypes(db)}catch(error){throw new Error('Anki note type metadata: '+(error instanceof Error?error.message:String(error)))}try{decks=modern&&tableExists(db,'decks')?decodeModernDecks(db,profileId):decodeLegacyDecks(db,profileId)}catch(error){throw new Error('Anki deck metadata: '+(error instanceof Error?error.message:String(error)))}const noteTypeMap=new Map(noteTypes.map((item)=>[item.sourceId,item])),deckMap=new Map(decks.map((item)=>[item.sourceId,item.local.id]));"
          if old2 not in s: raise SystemExit('metadata target missing')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/anki-package.ts
          git commit -m "add Anki package import error context"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

name: Apply Anki compatibility patches

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - scripts/apply-anki-compat-patches.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patches
        run: node scripts/apply-anki-compat-patches.mjs
      - name: Commit patched sources
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/templates.ts src/anki/anki-package.ts src/anki/defaults.ts src/review/controller.ts
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "integrate native Anki image occlusion flow"
            git push origin HEAD:agent/anki-parity-rewrite-20260815
          fi

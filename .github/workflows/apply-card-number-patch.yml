name: Apply Card Number Generator Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-card-number-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch generated cards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/anki/templates.ts')
          text = path.read_text()
          marker = "    id: existing?.id ?? uid('card'),\n    profileId: note.profileId,"
          replacement = "    id: existing?.id ?? uid('card'),\n    cardNumber: fieldValue(note, '__CardNumber').trim() || existing?.cardNumber || base.cardNumber,\n    profileId: note.profileId,"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('expected makeCard marker was not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'work-1-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add src/anki/templates.ts
          git commit -m 'persist optional card numbers on generated cards'
          git push

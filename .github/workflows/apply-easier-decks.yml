name: Apply easier deck and FSRS patch

on:
  push:
    branches:
      - agent/easier-decks-card-numbers-fsrs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/easier-decks-card-numbers-fsrs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit
      - run: node scripts/apply-easier-decks-card-numbers-fsrs.mjs
      - run: npm run check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "improve deck creation, card numbering, and FSRS fidelity"
          git push origin HEAD:agent/easier-decks-card-numbers-fsrs

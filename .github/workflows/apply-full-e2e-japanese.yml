name: Apply Japanese full E2E expectations

on:
  push:
    branches:
      - agent/japanese-deck-import-export-stats

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/japanese-deck-import-export-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update expectations
        run: python scripts/update-full-e2e-japanese.py
      - name: Validate
        run: |
          npm install --ignore-scripts --no-audit
          npm run lint
          npm run typecheck
          npm test
      - name: Commit update
        run: |
          git config user.name "work_1 review bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/full-function.e2e.mjs
          git commit -m "align full acceptance tests with Japanese UI"
          git push origin HEAD:agent/japanese-deck-import-export-stats

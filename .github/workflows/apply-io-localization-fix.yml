name: Apply image occlusion localization fix

on:
  push:
    branches:
      - agent/japanese-deck-import-export-stats

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/japanese-deck-import-export-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused fix
        run: python scripts/fix-image-occlusion-localization.py
      - name: Validate
        run: |
          npm install --ignore-scripts --no-audit
          npm run lint
          npm run typecheck
          npm test
          npm run security
      - name: Commit fix
        run: |
          git config user.name "work_1 review bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests/browser.e2e.mjs
          git commit -m "decouple image occlusion launch from display text"
          git push origin HEAD:agent/japanese-deck-import-export-stats

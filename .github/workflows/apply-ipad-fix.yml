name: Apply iPad compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.patch/**'
      - 'scripts/apply-ipad-fix.mjs'
      - '.github/workflows/apply-ipad-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source changes
        run: node scripts/apply-ipad-fix.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix iPad controls and persist card numbers"
          git push origin HEAD:main

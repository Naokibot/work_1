name: Apply Japanese deck and stats update

on:
  push:
    branches:
      - agent/japanese-deck-import-export-stats

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/japanese-deck-import-export-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: |
          sed -i "s/?? ranges\[0\];/?? ranges[0]!;/" scripts/apply-japanese-deck-stats.py
          python scripts/apply-japanese-deck-stats.py
      - name: Validate before commit
        run: |
          npm install --ignore-scripts --no-audit
          npm run lint
          npm run typecheck
          npm test
          npm run security
      - name: Commit implementation
        run: |
          git config user.name "work_1 review bot"
          git config user.email "actions@users.noreply.github.com"
          git add src index.html tests package.json ANKI_AUDIT_2026-08-15.md
          git commit -m "localize note UI and add portable deck workflows"
          git push origin HEAD:agent/japanese-deck-import-export-stats

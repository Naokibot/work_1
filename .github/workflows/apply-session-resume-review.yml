name: Apply Session Resume Review Fix

on:
  push:
    branches: [review-full-function-20260815]
    paths:
      - .github/workflows/apply-session-resume-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: review-full-function-20260815
      - name: Restore active study session on boot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/app.ts')
          s = p.read_text()
          old = """    const session = await getCurrentSession();\n    if (session && session.cursor < session.queue.length) this.showStatus(`途中の学習があります（${session.cursor}/${session.queue.length}）。`, false, 7000);\n"""
          new = """    const session = await getCurrentSession();\n    if (session && session.cursor < session.queue.length) {\n      this.showStatus(`途中の学習を復元します（${session.cursor}/${session.queue.length}）。`, false, 7000);\n      await this.review.resume(session);\n    }\n"""
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/app/app.ts
          git commit -m "restore interrupted study sessions on startup"
          git push origin HEAD:review-full-function-20260815

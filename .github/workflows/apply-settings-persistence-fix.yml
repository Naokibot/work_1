name: Apply settings persistence fix

on:
  push:
    branches:
      - review-persistence-20260815

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: review-persistence-20260815
      - name: Patch stale settings writes
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/app.ts')
          text = path.read_text()
          old = "input.addEventListener('change', () => void saveSettings({ ...settings, [key]: input.checked }));"
          new = "input.addEventListener('change', () => void (async () => { const current = await getSettings(); await saveSettings({ ...current, [key]: input.checked }); })());"
          if old not in text:
              raise SystemExit('target settings handler not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "work_1 review bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/app.ts
          git commit -m "fix sequential settings persistence"
          git push origin HEAD:review-persistence-20260815

name: CI
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security
      - run: npm audit --audit-level=high
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Chromium and WebKit acceptance
        run: npm run e2e

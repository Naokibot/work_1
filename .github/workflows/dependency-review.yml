name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GitHub dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependency metadata
        run: npm install --ignore-scripts --no-audit
      - name: High-severity dependency audit fallback
        run: npm audit --audit-level=high
      - name: Explain GitHub Dependency Graph requirement
        if: steps.dependency-review.outcome == 'failure'
        run: echo 'GitHub Dependency Review could not complete. npm audit passed; enable Dependency graph in repository Security settings to activate the native GitHub review.'

name: Fix Anki unicase collation

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/fix-anki-unicase.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add read-only SQLite collation shim
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/anki/anki-package.ts')
          s=p.read_text()
          marker="function rows(db: SqlDatabase, sql: string): SqlRow[] {"
          helper="""function makeSqlJsReadable(bytes: Uint8Array): Uint8Array {
            // Anki registers a custom SQLite collation named `unicase`. sql.js does not
            // expose sqlite3_create_collation(), and our package importer is read-only.
            // Replacing only schema occurrences of `COLLATE unicase` with the equal-length
            // built-in `COLLATE binary ` lets SQLite parse Anki's schema without touching
            // note/card payloads or changing byte offsets in the database pages.
            const output = bytes.slice();
            const needle = textEncoder.encode('COLLATE unicase');
            const replacement = textEncoder.encode('COLLATE binary ');
            for (let start = 0; start <= output.length - needle.length; start += 1) {
              let matches = true;
              for (let index = 0; index < needle.length; index += 1) {
                if (output[start + index] !== needle[index]) { matches = false; break; }
              }
              if (matches) { output.set(replacement, start); start += needle.length - 1; }
            }
            return output;
          }

          """
          if marker not in s: raise SystemExit('helper marker missing')
          s=s.replace(marker,helper+marker,1)
          old="const media=latest?decodeLatestMedia(zip):decodeLegacyMedia(zip),SQL=await sqlRuntime(),db=new SQL.Database(collectionBytes);"
          if old in s:
              new="const media=latest?decodeLatestMedia(zip):decodeLegacyMedia(zip),SQL=await sqlRuntime(),db=new SQL.Database(makeSqlJsReadable(collectionBytes));"
              s=s.replace(old,new,1)
          else:
              old2="const SQL=await sqlRuntime(),db=new SQL.Database(collectionBytes);"
              if old2 not in s: raise SystemExit('database constructor marker missing')
              s=s.replace(old2,"const SQL=await sqlRuntime(),db=new SQL.Database(makeSqlJsReadable(collectionBytes));",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/anki-package.ts
          git commit -m "read official Anki SQLite unicase schemas"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

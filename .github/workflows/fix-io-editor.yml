name: Fix Image Occlusion editor

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/fix-io-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch editor review findings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/anki/image-occlusion-editor.ts')
          s=p.read_text()
          replacements=[
            ("private gesture: { kind: 'draw' | 'move' | 'resize'; id?: string; start: Point; original?: ImageOcclusionMask } | null = null;", "private gesture: { kind: 'draw' | 'move' | 'resize'; id?: string; start: Point; original?: ImageOcclusionMask; before?: ImageOcclusionMask[] } | null = null;"),
            ("this.imageDataUrl=data;this.image.src=data;this.image.hidden=false;this.stage.querySelector<HTMLElement>('[data-empty]')?.setAttribute('hidden','');this.masks=[];this.pushSnapshot([]);this.render();", "this.imageDataUrl=data;this.image.src=data;this.image.hidden=false;this.stage.querySelector<HTMLElement>('[data-empty]')?.setAttribute('hidden','');this.masks=[];this.undoStack=[];this.redoStack=[];this.render();"),
            ("this.gesture={kind:handle?'resize':'move',id:mask.id,start:this.point(event),original:{...mask,points:mask.points?.map((point)=>({...point}))}};", "this.gesture={kind:handle?'resize':'move',id:mask.id,start:this.point(event),original:{...mask,points:mask.points?.map((point)=>({...point}))},before:cloneMasks(this.masks)};"),
            ("    else this.saveHistory();\n", "    else {if(g.before){this.undoStack.push(g.before);this.redoStack=[];}this.render();}\n"),
            ("  private saveHistory():void{if(!this.gesture){this.undoStack.push(cloneMasks(this.masks));this.redoStack=[];this.render();}}\n", ""),
            ("if(!select)return;void getAnkiState().then((state)=>{const type=state.noteTypes.find((item)=>item.id===select.value);if(type?.kind!=='image-occlusion')return;event.preventDefault();event.stopImmediatePropagation();editor?.open();});", "if(!select)return;event.preventDefault();event.stopImmediatePropagation();void getAnkiState().then((state)=>{const type=state.noteTypes.find((item)=>item.id===select.value);if(type?.kind!=='image-occlusion')return;editor?.open();});")
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('missing patch target: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/image-occlusion-editor.ts
          git commit -m "fix image occlusion editor interaction history"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

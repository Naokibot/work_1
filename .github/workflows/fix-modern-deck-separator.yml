name: Fix modern Anki deck separator

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/fix-modern-deck-separator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize current Anki deck hierarchy separator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/anki/anki-package.ts')
          source = path.read_text()
          old = "name:asString(row.name,'Imported'),description:protoString(normalCfg,4)"
          new = "name:asString(row.name,'Imported').replace(/\\x1f/g,'::'),description:protoString(normalCfg,4)"
          if old not in source:
              raise SystemExit('modern deck name target not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/anki-package.ts
          git commit -m "normalize current Anki deck hierarchy names"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

name: Fix protobuf varint decoding

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/fix-protobuf-varint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Support full protobuf uint64 varints
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/anki/anki-package.ts')
          source = path.read_text()
          old = '''function readVarint(bytes: Uint8Array, offset: number): { value: number; next: number } {
            let value = 0, shift = 0, cursor = offset;
            while (cursor < bytes.length && shift <= 49) {
              const byte = bytes[cursor++] ?? 0;
              value += (byte & 0x7f) * 2 ** shift;
              if ((byte & 0x80) === 0) return { value, next: cursor };
              shift += 7;
            }
            throw new Error('Invalid protobuf varint');
          }'''.replace('            ', '')
          new = '''function readVarint(bytes: Uint8Array, offset: number): { value: number; next: number } {
            let value = 0n;
            let shift = 0n;
            let cursor = offset;
            for (let count = 0; count < 10 && cursor < bytes.length; count += 1) {
              const byte = bytes[cursor++] ?? 0;
              value |= BigInt(byte & 0x7f) << shift;
              if ((byte & 0x80) === 0) {
                const max = BigInt(Number.MAX_SAFE_INTEGER);
                return { value: Number(value > max ? max : value), next: cursor };
              }
              shift += 7n;
            }
            throw new Error('Invalid protobuf varint');
          }'''.replace('            ', '')
          if old not in source:
              raise SystemExit('readVarint target not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/anki-package.ts
          git commit -m "decode full-width protobuf varints"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

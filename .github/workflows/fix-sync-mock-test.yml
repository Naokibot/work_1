name: Fix Sync Mock Test

on:
  push:
    branches: [review-full-function-20260815]
    paths:
      - .github/workflows/fix-sync-mock-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: review-full-function-20260815
      - name: Use a GAS-shaped mock deployment id
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/full-function.e2e.mjs')
          s=p.read_text().replace('https://script.google.com/macros/s/test/exec','https://script.google.com/macros/s/abcdefghijklmnop/exec')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add tests/full-function.e2e.mjs
          git commit -m "use valid GAS-shaped sync mock URL"
          git push origin HEAD:review-full-function-20260815

name: Fix Anki unicase schema casing

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/fix-unicase-case.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Handle official lowercase schema collation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/anki/anki-package.ts')
          s=p.read_text()
          old="const needle = textEncoder.encode('COLLATE unicase');\n  const replacement = textEncoder.encode('COLLATE binary ');\n  for (let start = 0; start <= output.length - needle.length; start += 1) {\n    let matches = true;\n    for (let index = 0; index < needle.length; index += 1) {\n      if (output[start + index] !== needle[index]) { matches = false; break; }\n    }\n    if (matches) { output.set(replacement, start); start += needle.length - 1; }\n  }"
          new="for (const [from, to] of [['COLLATE unicase', 'COLLATE binary '], ['collate unicase', 'collate binary ']] as const) {\n    const needle = textEncoder.encode(from);\n    const replacement = textEncoder.encode(to);\n    for (let start = 0; start <= output.length - needle.length; start += 1) {\n      let matches = true;\n      for (let index = 0; index < needle.length; index += 1) {\n        if (output[start + index] !== needle[index]) { matches = false; break; }\n      }\n      if (matches) { output.set(replacement, start); start += needle.length - 1; }\n    }\n  }"
          if old not in s:
              raise SystemExit('unicase patch target missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add src/anki/anki-package.ts
          git commit -m "handle official Anki unicase schema casing"
          git push origin HEAD:agent/anki-parity-rewrite-20260815

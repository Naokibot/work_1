name: Fix WebKit Browser Wait

on:
  push:
    branches: [review-full-function-20260815]
    paths:
      - .github/workflows/fix-webkit-browser-wait.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: review-full-function-20260815
      - name: Wait for browser render instead of sleeping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser.e2e.mjs')
          s=p.read_text()
          old="""    await page.locator('[data-route=\"anki\"]').click();\n    await page.waitForTimeout(250);\n    const browserText = await page.locator('#view').innerText();\n"""
          new="""    await page.locator('[data-route=\"anki\"]').click();\n    await page.waitForFunction(() => document.getElementById('view')?.textContent?.includes('ブラウザ / 高度な検索'));\n    const browserText = await page.locator('#view').innerText();\n"""
          if old not in s: raise SystemExit('primary browser wait snippet not found')
          s=s.replace(old,new,1)
          old2="""    await page.locator('[data-route=\"anki\"]').click();\n    await page.waitForTimeout(250);\n    assert.ok((await page.locator('#view').innerText()).includes('Capital of Japan?'), `${name}: IndexedDB persists after reload`);\n"""
          new2="""    await page.locator('[data-route=\"anki\"]').click();\n    await page.waitForFunction(() => document.getElementById('view')?.textContent?.includes('ブラウザ / 高度な検索'));\n    assert.ok((await page.locator('#view').innerText()).includes('Capital of Japan?'), `${name}: IndexedDB persists after reload`);\n"""
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add tests/browser.e2e.mjs
          git commit -m "wait for browser render in WebKit acceptance"
          git push origin HEAD:review-full-function-20260815

name: Refresh dependency lock

on:
  push:
    branches:
      - agent/anki-parity-rewrite-20260815
    paths:
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: |
          git config user.name "Hotaru(Naokibot)"
          git config user.email "sagakatsuyuki.555@gmail.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "lock Anki package runtime dependencies"
            git push origin HEAD:agent/anki-parity-rewrite-20260815
          fi

name: Update numbering E2E

on:
  push:
    branches:
      - agent/easier-decks-card-numbers-fsrs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/easier-decks-card-numbers-fsrs
      - name: Update old free-form number expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/full-function.e2e.mjs')
          s=p.read_text()
          s=s.replace('const numberInput=page.locator(\'textarea[data-field="__CardNumber"]\');\n  if(number && await numberInput.count()) await numberInput.fill(number);', 'const numberInput=page.locator(\'select[data-field="__CardNumber"]\');\n  if(number && await numberInput.count()) await numberInput.selectOption(number);')
          s=s.replace("number:'001'", "number:'1'").replace("c.cardNumber==='001'", "c.cardNumber==='1'")
          s=s.replace("number:'R-01'", "number:'2'")
          s=s.replace("number:'C-01'", "number:'4'")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/full-function.e2e.mjs
          git commit -m "align full-function E2E with selectable card numbers"
          git push origin HEAD:agent/easier-decks-card-numbers-fsrs
